apiVersion: apps/v1
kind: Deployment
metadata:
  name: sih-serve-api
  labels:
    app: sih-serve-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sih-serve-api
  template:
    metadata:
      labels:
        app: sih-serve-api
    spec:
      containers:
        - name: serve-api
          image: ghcr.io/krishivwahi/SIH-26006/sih-serve:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: model-store
              mountPath: /app/models
            - name: forecast-data
              mountPath: /app/data/interim
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: model-store-pvc
        - name: forecast-data
          persistentVolumeClaim:
            claimName: forecast-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sih-serve-api-svc
spec:
  selector:
    app: sih-serve-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
